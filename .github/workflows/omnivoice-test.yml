name: OmniVoice Bengali Clone - TEST

on:
  workflow_dispatch:
  push:
    paths:
      - 'voice_text.txt'
      - 'ref_text.txt'
      - 'ref_audio/**'
      - 'scripts/omnivoice_clone.py'

jobs:
  test-omnivoice:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install gradio_client requests

      - name: Generate voice via OmniVoice API (k2-fsa/OmniVoice)
        run: |
          python scripts/omnivoice_clone.py

      - name: Upload Test Audio
        uses: actions/upload-artifact@v4
        with:
          name: omnivoice-test-bangla
          path: output/
          retention-days: 7
