name: Generate Voice with F5-TTS

on:
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য
    inputs:
      target_text:
        description: 'যে বাংলা লেখাটি ভয়েসে রূপান্তর করতে চান'
        required: true
        default: 'হ্যালো! এটি গিটহাব অ্যাকশনস এবং এফ ফাইভ টিটিএস দিয়ে তৈরি বাংলা ভয়েস।'
        type: string

jobs:
  generate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          # CPU সংস্করণের টর্চ এবং F5-TTS ইনস্টল করা
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install f5-tts

      - name: Run Voice Generation Script
        env:
          TARGET_TEXT: ${{ github.event.inputs.target_text }}
        run: |
          python scripts/generate_voice.py

      - name: Upload Generated Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-voice-output
          path: output/*.wav
