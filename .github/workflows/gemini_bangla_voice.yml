name: Gemini TTS Voice Generator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google GenAI Library
      run: |
        python -m pip install --upgrade pip
        pip install google-genai


    - name: Run Voice Generation Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python scripts/gemini_bangla_voice.py

    # পুরো output ফোল্ডারটি ডাউনলোডের জন্য আপলোড করা
    - name: Upload Output Folder Artifact
      uses: actions/upload-artifact@v4
      with:
        name: voice-output-folder
        path: output/
