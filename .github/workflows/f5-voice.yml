name: F5-TTS Voice Generation

on:
  workflow_dispatch:
  push:
    paths:
      - 'voice_text.txt'
      - 'ref_audio/**'
      - 'ref_text.txt'
      - 'scripts/**'

jobs:
  generate-voice:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: f5-tts-v1-base-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            f5-tts-v1-base-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Force numpy 2.x reinstall to fix pyarrow conflict
          pip install "numpy>=2.0,<2.3" --force-reinstall

      - name: Check files
        run: |
          echo "=== ref_audio ==="
          ls -lh ref_audio/
          echo ""
          echo "=== voice_text.txt ==="
          cat voice_text.txt
          echo ""
          echo "Chars: $(wc -m < voice_text.txt)"
          echo ""
          echo "=== ref_text.txt ==="
          cat ref_text.txt
          echo ""
          echo "=== Python & NumPy version ==="
          python -c "import numpy; print(numpy.__version__)"
          python -c "import torch; print(torch.__version__)"

      - name: Generate voice with F5-TTS
        run: |
          python scripts/f5_tts_generate.py

      - name: Upload generated voice
        uses: actions/upload-artifact@v4
        with:
          name: generated-voice
          path: output/
          retention-days: 7

      - name: Show output info
        run: |
          ls -lh output/
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/output_voice_f5.wav || echo "ffprobe not available"
