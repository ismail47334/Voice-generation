name: F5-TTS Voice Clone Bengali

on:
  workflow_dispatch:
    inputs:
      custom_text:
        description: 'Custom Bengali text (leave empty to use voice_text.txt)'
        required: false
        default: ''
      speed:
        description: 'Speed'
        required: false
        default: '1.0'
        type: choice
        options:
          - '0.8'
          - '1.0'
          - '1.2'

jobs:
  generate-voice:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Cache HF Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: f5-tts-v1-base-${{ hashFiles('requirements.txt') }}
          restore-keys: f5-tts-v1-base-
      
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      
      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check files
        run: |
          echo "=== ref_audio ==="
          ls -lh ref_audio/
          echo ""
          echo "=== voice_text.txt ==="
          cat voice_text.txt
          echo ""
          echo "Chars: $(wc -m < voice_text.txt)"
          echo ""
          echo "=== ref_text.txt ==="
          cat ref_text.txt
      
      - name: Override voice_text.txt if custom input given
        if: ${{ inputs.custom_text != '' }}
        run: |
          echo "${{ inputs.custom_text }}" > voice_text.txt
          echo "Using custom text from workflow input"
          cat voice_text.txt
      
      - name: Generate voice with F5-TTS
        run: |
          python scripts/f5_tts_generate.py
      
      - name: Convert to MP3
        run: |
          ffmpeg -i output/output_voice_f5.wav -codec:a libmp3lame -qscale:a 2 output/output_voice_f5.mp3 -y
          ls -lh output/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: f5-bengali-voice-${{ github.run_number }}
          path: |
            output/output_voice_f5.wav
            output/output_voice_f5.mp3
          retention-days: 14
