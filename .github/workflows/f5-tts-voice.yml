name: Generate Voice from Text File

on:
  workflow_dispatch:

jobs:
  generate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install f5-tts
          pip install soundfile

      - name: Run Voice Generation Script
        run: |
          python scripts/generate_voice.py

      - name: Upload Generated Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-voice-output
          path: output/
