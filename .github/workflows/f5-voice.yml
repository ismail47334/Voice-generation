name: F5-TTS Voice Generation

on:
  workflow_dispatch:
  push:
    paths:
      - 'voice_text.txt'
      - 'ref_audio/**'
      - 'ref_text.txt'
      - 'scripts/**'

jobs:
  generate-voice:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python deps - FIXED
        run: |
          pip install --upgrade pip
          # Install without cache to avoid old numpy
          pip install --no-cache-dir -r requirements.txt

      - name: Verify versions
        run: |
          python -c "import numpy; print(f'NumPy: {numpy.__version__}')"
          python -c "import torch; print(f'Torch: {torch.__version__}')"
          python -c "import f5_tts; print('F5-TTS OK')"
          ls -lh ref_audio/
          wc -m voice_text.txt ref_text.txt

      - name: Generate voice
        run: |
          python scripts/f5_tts_generate.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-voice
          path: output/
          retention-days: 7
