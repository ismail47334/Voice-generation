name: Sherpa-ONNX Bengali Voice (FAST & FREE)

on:
  workflow_dispatch:
  push:
    paths:
      - 'voice_text.txt'
      - 'scripts/**'

jobs:
  generate-bangla-voice-sherpa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1 espeak-ng

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: vits-piper-bn
          key: piper-bn-nabanita-v2

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install piper-tts soundfile numpy

      - name: Download Public Bengali Model (No Token Needed)
        run: |
          mkdir -p vits-piper-bn
          if [ ! -f "vits-piper-bn/bn_BD_nabanita_medium.onnx" ]; then
            echo "Downloading public Piper BN model..."
            cd vits-piper-bn
            wget -q https://huggingface.[STRIPPED 83 bytes].onnx -O bn_BD_nabanita_medium.onnx
            wget -q https://huggingface.[STRIPPED 83 bytes].onnx.json -O bn_BD_nabanita_medium.onnx.json
            cd ..
          fi
          ls -lh vits-piper-bn/

      - name: Generate voice from voice_text.txt
        run: |
          python scripts/sherpa_tts.py

      - name: Upload Final Audio
        uses: actions/upload-artifact@v4
        with:
          name: bangla-voice-final
          path: output/
          retention-days: 7
