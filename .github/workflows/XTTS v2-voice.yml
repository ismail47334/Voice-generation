name: Generate Voice with XTTS v2

on:
  workflow_dispatch:

jobs:
  generate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Espeak)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          # PyTorch কে পুরানো ও স্টেবল সংস্করণে সেট করা যাতে torchcodec এরর না আসে
          pip install torch==2.4.0 torchaudio==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          pip install coqui-tts soundfile
          pip install "transformers>=4.49,<5"

      - name: Run Voice Generation Script
        run: |
          python xtts_generate.py

      - name: Upload Generated Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-voice-output
          path: output/
