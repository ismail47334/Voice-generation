name: IndicF5 Bengali Voice - FIXED for Gated

on:
  workflow_dispatch:
  push:
    paths:
      - 'voice_text.txt'
      - 'ref_text.txt'
      - 'ref_audio/**'
      - 'scripts/**'

jobs:
  generate-bangla-voice:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Verify files
        run: |
          ls -lh ref_audio/
          cat ref_text.txt
          echo "---"
          cat voice_text.txt | head -c 200

      - name: Generate Bengali voice with IndicF5 (with HF_TOKEN)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/indicf5_generate.py

      - name: Upload Bangla voice
        uses: actions/upload-artifact@v4
        with:
          name: bangla-voice-indicf5
          path: output/
          retention-days: 7
